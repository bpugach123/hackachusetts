<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Perseus Night Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Full-screen map app: the map fills the window, panels float over inland Massachusetts, the point report docks right. */
:root { --bg: #0A1017; --fg: #E6EDF3; --focus: #4DA3FF; color-scheme: dark; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #DCE9F2; --fg: #0F1B26; --focus: #1F6FD1; color-scheme: light; } }
:root[data-theme="light"] { --bg: #DCE9F2; --fg: #0F1B26; --focus: #1F6FD1; color-scheme: light; }
html, body, #root { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; }
a { color: inherit; }
a:hover { opacity: .8; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@keyframes pping { 0% { transform: translate(-50%, -50%) scale(.5); opacity: .9; } 100% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
<div id="root"></div>
<script src="points-data.js"></script>
<script src="points-bridge.js"></script>
<script src="app.js"></script>

</body></html>
